name: Weekly Bunker Scraper

on:
  schedule:
    # Runs every Monday to Friday at 08:00 UTC
    - cron: '0 1 * * 1-5'
  workflow_dispatch: # Allows you to trigger it manually to test

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Script
        run: python scripts/bunker/scrape_bunker.py
      - name: Save CSV back to repo
        run: |
          git config --global user.name 'BunkerBot'
          git config --global user.email 'bot@github.com'
          git add data/processed/bunker/all_bunker_prices.csv
          git commit -m "Automated Weekly Update" || echo "No changes to commit"
          git push
